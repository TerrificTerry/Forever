<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="void" cx="50%" cy="45%" r="74%">
      <stop offset="0%" stop-color="#220204"/>
      <stop offset="62%" stop-color="#090102"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="throne" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff1b1b"/>
      <stop offset="38%" stop-color="#9d0509"/>
      <stop offset="100%" stop-color="#250102"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a0204"/>
      <stop offset="45%" stop-color="#090102"/>
      <stop offset="100%" stop-color="#5a0307"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7df"/>
      <stop offset="55%" stop-color="#d6c29f"/>
      <stop offset="100%" stop-color="#8a765c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#void)"/>

  <!-- white-bone outer rim -->
  <path d="M17 21 L31 34 M43 12 L49 30 M64 8 V27 M85 12 L79 30 M111 21 L97 34 M118 45 L99 51 M119 76 L100 72 M104 105 L89 91 M64 120 V98 M24 105 L39 91 M9 76 L28 72 M10 45 L29 51"
        stroke="url(#bone)" stroke-width="7" stroke-linecap="round"/>
  <g fill="url(#bone)" stroke="#3b251b" stroke-width="1.2">
    <circle cx="17" cy="21" r="6"/>
    <circle cx="43" cy="12" r="5.5"/>
    <circle cx="64" cy="8" r="6"/>
    <circle cx="85" cy="12" r="5.5"/>
    <circle cx="111" cy="21" r="6"/>
    <circle cx="118" cy="45" r="5"/>
    <circle cx="119" cy="76" r="5"/>
    <circle cx="104" cy="105" r="5.5"/>
    <circle cx="64" cy="120" r="6"/>
    <circle cx="24" cy="105" r="5.5"/>
    <circle cx="9" cy="76" r="5"/>
    <circle cx="10" cy="45" r="5"/>
  </g>

  <!-- ember halo behind throne -->
  <path d="M34 103 C25 82 33 66 28 47 C40 58 43 75 53 84 C46 67 51 50 64 31 C77 50 82 67 75 84 C85 75 88 58 100 47 C95 66 103 82 94 103 Z"
        fill="#ff2a10" opacity=".28" filter="url(#glow)"/>

  <!-- tall throne silhouette -->
  <path d="M33 112 V46 C33 32 44 23 57 23 H71 C84 23 95 32 95 46 V112 Z"
        fill="url(#darkMetal)" stroke="#dc1118" stroke-width="4"/>
  <path d="M45 108 V48 C45 39 52 34 60 34 H68 C76 34 83 39 83 48 V108 Z"
        fill="url(#throne)" stroke="#420003" stroke-width="3"/>
  <path d="M50 61 H78 L84 78 H44 Z" fill="#080102" stroke="#c70b12" stroke-width="3"/>
  <path d="M45 78 H83 L92 112 H36 Z" fill="#7d0307" stroke="#270001" stroke-width="3"/>
  <path d="M30 111 H98 L106 123 H22 Z" fill="#060101" stroke="#b30b0f" stroke-width="4"/>

  <!-- throne crown and spikes -->
  <path d="M42 42 L51 19 L59 41 L64 14 L69 41 L77 19 L86 42 Z"
        fill="#070101" stroke="#f21b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M52 48 C56 39 61 37 64 26 C67 37 72 39 76 48 C69 45 59 45 52 48 Z"
        fill="#ff1018" opacity=".85"/>

  <!-- bone armrests -->
  <path d="M31 69 L14 64 M97 69 L114 64 M36 87 L19 94 M92 87 L109 94"
        stroke="url(#bone)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="14" cy="64" r="4.5" fill="url(#bone)"/>
  <circle cx="114" cy="64" r="4.5" fill="url(#bone)"/>
  <circle cx="19" cy="94" r="4.5" fill="url(#bone)"/>
  <circle cx="109" cy="94" r="4.5" fill="url(#bone)"/>

  <!-- blood-red seat highlight -->
  <path d="M52 79 H76 L81 105 H47 Z" fill="#c5090f" opacity=".7"/>
  <path d="M58 36 H70 V105 H58 Z" fill="#ff2a2a" opacity=".18"/>
</svg>
